stages:
  - test
  - build
  - deploy

default:
  image: node:20
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules/

test:
  stage: test
  script:
    - npm install
    - npm test

build:
  stage: build
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy:
  stage: deploy
  script:
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "master"